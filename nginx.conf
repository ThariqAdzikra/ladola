events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    upstream frontend {
        server 127.0.0.1:3000;
    }

    upstream backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;

        # Simple health endpoint from Nginx itself (bypasses upstreams)
        location = /__nginx_health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # NextAuth must be handled by the frontend.
        # Use ^~ so this prefix wins over the regex /api matcher below.
        location ^~ /api/auth {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Other API and model routes go to the backend.
        location ~ ^/(api|predict|chat|health|diseases)(/|$) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Generous timeouts: model inference + Gemini API can be slow
            proxy_connect_timeout  10s;
            proxy_read_timeout    120s;
            proxy_send_timeout     30s;
        }

        # Everything else goes to the Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
